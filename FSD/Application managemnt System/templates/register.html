<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>
    <style>
        body{
            text-align: center;
            padding-top: 150px;
            background-color:  rgb(170, 167, 167);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            input{
                border-radius: 5px;
            }
            button{
                padding:7px 9px 7px 9px;
                border-radius: 20px;
            }
            .s{
                display:flex;
                gap:50px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <form action="/" method="post">
        <h3 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif">Register</h3>
        ID: <input type="number" name="id" required><br><br>
        Name: <input type="text" name="name" required><br><br>
        Email: <input type="email" name="email" required><br><br>
        Class: <input type="text" name="class" required><br><br>
        Password: <input type="password" name="password" required><br><br><br>
        <div class="s">
        <button action="submit" value="create" style="color: black;">Register</button>
        <button><a href="/login" style="color: black; text-decoration: none; padding-left: 12px; padding-right: 12px;">Login</a></button>
        </div>
    </form>
</body>
</html>
