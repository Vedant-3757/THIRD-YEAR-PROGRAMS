<!DOCTYPE html>
<html lang="en">
<head>
    <title>Profile</title>
</head>
<body>
    <form action="/profile" method="post">
        <h2>Your Profile</h2>
        {% if user %}
        Name: {{user[0]}}<br><br>
        Email: {{user[1]}}<br><br>
        Class: {{user[2]}}<br><br>
        {% else %}
        <h2>DETAILS NOT FOUND!!</h2>
        {% endif %}
    </form>
</body>
</html>
