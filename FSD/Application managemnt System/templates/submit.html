<!DOCTYPE html>
<html lang="en">
<head>
    <title>New Application</title>
    <style>
        body{
            padding-left: 500px;
            padding-top: 10px;
            background-color: rgb(170, 167, 167);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            textarea{
                border-radius: 7px;
            }
            input{
                border-radius: 7px;
            }
            button{
                padding: 7px 9px 7px 9px;
                border-radius: 10px;
            }
            }
    </style>
</head>
<body>
    <form action="/newapplication" method="post">
        <h2 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Submit a New Application</h2>
        Date: <br>
        <input type="date" name="date" required><br><br>
        To: <br>
        <textarea name="whom" cols="20" rows="5"></textarea><br><br>
        Subject: <br>
        <textarea name="subject" cols="20" rows="5"></textarea><br><br>
        Description: <br>
        <textarea name="desc" rows="5" cols="40" required></textarea><br><br>
        Greetings: <br>
        <textarea name="greetings" cols="30" rows="5"></textarea><br><br>
        <button action="submit">Submit</button>
    </form>
</body>
</html>
