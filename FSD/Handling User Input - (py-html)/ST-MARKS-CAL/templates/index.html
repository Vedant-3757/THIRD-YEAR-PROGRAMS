<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Marks Calculator</title>
</head>
<body>
    
    <form action="/calculate" method="post">

        <label for="name">Student Name: </label>
        <input type="text" name="name" required><br>

        <label for="roll">Roll No.: </label>
        <input type="number" name="roll" required><br>

        <label for="fsd">FSD: </label>
        <input type="number" name="fsd" required><br>

        <label for="wad">WEB APPLN DEV: </label>
        <input type="number" name="wad" required><br>

        <label for="cloud">CLOUD: </label>
        <input type="number" name="cloud" required><br>

        <label for="net">.NET: </label>
        <input type="number" name="net" required><br>

        <button type="submit" value="/calculate">Calculate</button>
    </form>
    
    
</body>
</html>
