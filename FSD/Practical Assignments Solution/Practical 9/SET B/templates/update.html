<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <form action="/update" method="post">
        ID:<input type="number" name="id" required><br><br>
        Course:<input type="text" name="course" required><br><br>
        <button action="submit" value="updatestudent">UPDATE</button>
        <a href="/">go to home</a>
    </form>
    <table border="1" cellpadding="8">
        <tr>
            <td>ID</td>
            <td>NAME</td>
            <td>DEPARTMENT</td>
        </tr>
        {% for s in students %}
        <tr>
            <th>{{s[0]}}</th>
            <th>{{s[1]}}</th>
            <th>{{s[2]}}</th>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
