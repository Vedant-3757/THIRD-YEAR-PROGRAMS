<!DOCTYPE html>
<html lang="en">
<head>
    <title>Display Students</title>
</head>
<body>
    <h2>ALL STUDENTS</h2>
    <table border="1" cellpadding="8">
        
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>DEPARTMENT</th>
        </tr>
        {% for s in students %}
        <tr>
            <td>{{s[0]}}</td>
            <td>{{s[1]}}</td>
            <td>{{s[2]}}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/">GO TO HOME</a>
    <a href="/update">UPDATE STUDENT INFO</a>
    <a href="/delete">DELETE STUDENT</a>
</body>
</html>
