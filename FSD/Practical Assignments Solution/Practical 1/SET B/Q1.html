<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <label for="name">Name: </label>
    <input type="text" name="name"><br><br>
    <label for="age">Age: </label>
    <input type="number" name="age"><br><br>
    <label for="gender">Gender: </label>
    <input type="radio" name="gender">Male
    <input type="radio" name="gender">Female<br><br>
    <label for="class">Class: </label>
    <input type="checkbox" name="class">FY BSc 
    <input type="checkbox" name="class">SY BSc 
    <input type="checkbox" name="class">TY BSc <br><br>
    <label for="field">Stream: </label>
    <select>
        <option value="">Select Stream</option>
        <option>Computer Science</option>
        <option>Information Technology</option>
        <option>Cyber Security</option>
    </select><br><br>
    <label for="mark">12th Marks: </label>
    <input type="number" name="mark"><br><br>
    <label for="date">Enrolled when: </label>
    <input type="date" name="date"><br><br>
    <button type="submit">Submit</button>
</body>
</html>
